[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litecache"
version = "0.1.0"
description = "A tiny, thread-safe in-memory cache with TTL and LRU eviction."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "xuehaoweng" }]
keywords = ["cache", "ttl", "lru", "redis", "memcached"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/xuehaoweng/litecache"
Repository = "https://github.com/xuehaoweng/litecache.git"
Issues = "https://github.com/xuehaoweng/litecache/issues"
Changelog = "https://github.com/xuehaoweng/litecache/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "mypy>=1.8",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
litecache = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP045"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
